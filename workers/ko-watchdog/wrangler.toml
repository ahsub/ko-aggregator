name = "ko-watchdog"
main = "ko-watchdog.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron: 22:45 UTC Mo-Fr (45 Minuten nach GHA-Cron 22:00 UTC)
# Puffer: GHA braucht bis zu 30 Min (timeout-minutes: 30) -> bei 22:00 Start
# spaetestens fertig 22:30 -> 22:45 sicher.
# Seit v1.2 (11.09.2026, market-aggregator.yml): nur noch EIN taeglicher Lauf
# (Nachbörse statt Xetra-Vor-/NYSE-Oeffnungs-Lauf) -> nur noch ein Cron-
# Trigger noetig, kein Dual-Slot-Check mehr (s. ko-watchdog.js).
[triggers]
crons = ["45 22 * * 1-5"]

# KV Namespace Binding
[[kv_namespaces]]
binding = "KV"
id = "86c05f66e32346b99e720d861fedd1de"

# Secrets (via `wrangler secret put` oder CF Dashboard):
#   GH_WATCHDOG_PAT  — GitHub PAT (scope: repo)
#   GH_REPO          — optional, default: "ahsub/ko-aggregator"
#   GH_WORKFLOW      — optional, default: "market-aggregator.yml"
