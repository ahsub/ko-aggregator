name: "DIAGNOSE - CBOE-Erreichbarkeit von GitHub Actions"

on:
  workflow_dispatch:

jobs:
  test-cboe-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Test 7 - squeezemetrics.com Inhalt pruefen"
        run: |
          echo "=== Test 7: Inhalt und Content-Type von squeezemetrics.com ==="
          curl -sS -D - -o /tmp/sqz_body.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://squeezemetrics.com/monitor/static/DIX.csv"
          echo "--- Body: erste 500 Zeichen ---"
          head -c 500 /tmp/sqz_body.txt
          echo ""
          echo "--- Body: Dateigroesse ---"
          wc -c /tmp/sqz_body.txt
          echo "--- Body: letzte 300 Zeichen ---"
          tail -c 300 /tmp/sqz_body.txt

      - name: "Test 8 - erneuter Direktvergleich beide Quellen"
        run: |
          echo "=== CBOE nochmal ==="
          curl -sS -o /dev/null -w "CBOE HTTP Status: %{http_code}\n" \
            "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
          echo "=== SqueezeMetrics nochmal ==="
          curl -sS -o /dev/null -w "SqueezeMetrics HTTP Status: %{http_code}\n" \
            "https://squeezemetrics.com/monitor/static/DIX.csv"
