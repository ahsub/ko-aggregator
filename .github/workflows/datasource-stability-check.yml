name: "Datenquellen-Stabilitaets-Check (SqueezeMetrics + CBOE)"

# Axel-Vorgabe 10.08.2026: vor festem Einbau der frei nutzbaren SqueezeMetrics-
# und CBOE-Endpunkte (s. docs/GEX-SCHEMA.md v0.6, Abschnitt 3.1/3.2) einen
# mehrtaegigen Stabilitaets-Check laufen lassen. Ein einzelner erfolgreicher
# Test ist keine Verlaesslichkeitsgarantie (s. Warnung in GEX-SCHEMA.md 3.1:
# der erste Browser-Test dieser Session zeigte faelschlich 503 fuer
# SqueezeMetrics, korrigiert durch wiederholten Actions-Test).
#
# Laeuft 2x taeglich fuer ~1-2 Wochen, protokolliert jedes Ergebnis
# (Status, Content-Length, Zeitstempel) nach data/datasource_stability/log.jsonl.
# Nach Auswertung (Axel-Entscheidung): entweder fest in market_aggregator.py
# integrieren, oder laenger beobachten, oder verwerfen falls sich Instabilitaet
# zeigt. Dieser Workflow selbst ist NICHT die Produktiv-Integration.

permissions:
  contents: write

on:
  schedule:
    - cron: '15 05 * * *'   # 05:15 UTC = 07:15 MEZ
    - cron: '15 17 * * *'   # 17:15 UTC = 19:15 MEZ
  workflow_dispatch:

jobs:
  check-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Beide Quellen pruefen und protokollieren"
        run: |
          mkdir -p data/datasource_stability
          LOGFILE=data/datasource_stability/log.jsonl
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          check_source() {
            NAME=$1
            URL=$2
            RESULT=$(curl -sS -w "\n%{http_code}|%{size_download}|%{time_total}" -o /tmp/body_$NAME.txt "$URL" 2>/tmp/err_$NAME.txt)
            META=$(echo "$RESULT" | tail -1)
            HTTP_CODE=$(echo "$META" | cut -d'|' -f1)
            SIZE=$(echo "$META" | cut -d'|' -f2)
            TIME=$(echo "$META" | cut -d'|' -f3)
            LAST_MOD=$(curl -sS -I "$URL" 2>/dev/null | grep -i "^last-modified:" | sed 's/^[Ll]ast-[Mm]odified: //' | tr -d '\r')
            echo "{\"ts\":\"$TS\",\"source\":\"$NAME\",\"http_code\":\"$HTTP_CODE\",\"bytes\":\"$SIZE\",\"seconds\":\"$TIME\",\"last_modified\":\"$LAST_MOD\"}" >> "$LOGFILE"
            echo "$NAME: HTTP $HTTP_CODE, ${SIZE} bytes, Last-Modified: $LAST_MOD"
          }

          check_source "squeezemetrics_dix" "https://squeezemetrics.com/monitor/static/DIX.csv"
          check_source "cboe_vix" "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"

      - name: "Log committen"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/datasource_stability/log.jsonl
          git diff --staged --quiet || git commit -m "chore: Datenquellen-Stabilitaets-Log aktualisiert [skip ci]"
          git push
